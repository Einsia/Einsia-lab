/* Five workflows that Claude Opus 5.5 generated on 2026-10-27/28 (model-compare/out/claude-{maud,biomass,pyscf,flt,semis}).
   Every box is an agent() call of the submitted script, with the script's own label; counts and dependencies follow the
   scripts' control flow. Nothing was executed. */
var SERIF="'Times New Roman', Times, 'Nimbus Roman', 'STIX Two Text', serif", MONO="'Courier New', Courier, 'Nimbus Mono PS', monospace";
var PW=340, PAD=16, LOOP=44, IW=PW-2*PAD-LOOP, GAPY=30;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function r(v){return Math.round(v*10)/10}
function tw(s,size,mono){return s.length*size*(mono?0.6:0.47)}
function wrap(s,w,size,max){if(!s)return [];var ws=s.split(' '),L=[''];ws.forEach(function(x){var t=L[L.length-1]?L[L.length-1]+' '+x:x;if(tw(t,size)>w&&L[L.length-1])L.push(x);else L[L.length-1]=t});if(max&&L.length>max){L=L.slice(0,max);L[max-1]+=' …'}return L}
function mwrap(s,w,size){var parts=s.split(/(?<=[-_])/),L=[''];parts.forEach(function(p){var t=L[L.length-1]+p;if(tw(t,size,true)>w&&L[L.length-1])L.push(p);else L[L.length-1]=t});return L}
function T(x,y,s,o){o=o||{};return '<text x="'+r(x)+'" y="'+r(y)+'" font-family="'+(o.mono?MONO:SERIF)+'" font-size="'+(o.size||10)+'"'+(o.italic?' font-style="italic"':'')+(o.bold?' font-weight="bold"':'')+(o.anchor?' text-anchor="'+o.anchor+'"':'')+(o.ls?' letter-spacing="'+o.ls+'"':'')+(o.rot?' transform="rotate('+o.rot+' '+r(x)+' '+r(y)+')"':'')+' fill="'+(o.fill||'#111')+'">'+esc(s)+'</text>'}
function R(x,y,w,h,o){o=o||{};return '<rect x="'+r(x)+'" y="'+r(y)+'" width="'+r(w)+'" height="'+r(h)+'" rx="'+(o.rx==null?2:o.rx)+'" fill="'+(o.fill||'#fff')+'" stroke="'+(o.stroke||'#111')+'" stroke-width="'+(o.sw||0.9)+'"'+(o.dash?' stroke-dasharray="'+o.dash+'"':'')+'/>'}
function P(d,o){o=o||{};return '<path d="'+d+'" fill="none" stroke="'+(o.stroke||'#333')+'" stroke-width="'+(o.sw||0.9)+'"'+(o.dash?' stroke-dasharray="'+o.dash+'"':'')+(o.arrow?' marker-end="url(#'+o.arrow+')"':'')+'/>'}
function lab(x,y,s,anchor,size){size=size||8.6;var w=tw(s,size)+6,x0=anchor==='end'?x-w:anchor==='middle'?x-w/2:x;return '<rect x="'+r(x0)+'" y="'+r(y-size+0.5)+'" width="'+r(w)+'" height="'+r(size+3)+'" fill="#fff"/>'+T(anchor==='end'?x-3:anchor==='middle'?x:x+3,y,s,{size:size,italic:true,fill:'#333',anchor:anchor})}

/* A tiny drawing context: y grows as stages are appended; every stage returns its box for edges. */
function Panel(x0,AR){this.x0=x0;this.x=x0+PAD;this.y=0;this.s='';this.AR=AR}
Panel.prototype.node=function(y,label,sub,o){o=o||{};var w=o.w||IW,x=o.x==null?this.x+(IW-w)/2:o.x,L=mwrap(label,w-12,o.size||9.6),S=wrap(sub||'',w-12,8.6,o.maxl||4),h=7+L.length*10.6+S.length*10+6,dash=o.cond?'4 3':null,s='';
 if(o.code){s+=R(x,y,w,h,{dash:'1.2 2.2',stroke:'#555',fill:'#fbfbfb',rx:9})}
 else{if(o.stack){s+=R(x+5,y-4,w,h,{dash:dash,sw:0.7,stroke:'#666'})+R(x+2.5,y-2,w,h,{dash:dash,sw:0.7,stroke:'#666'})}s+=R(x,y,w,h,{dash:dash,fill:o.check?'#f4f4f4':'#fff'})}
 var yy=y+13.5;L.forEach(function(l){s+=T(x+6,yy,l,{mono:!o.code,size:o.code?9.6:(o.size||9.6),italic:!!o.code,bold:!!o.code});yy+=10.6});S.forEach(function(l){s+=T(x+6,yy,l,{size:8.6,italic:true,fill:'#444'});yy+=10});
 if(o.stack)s+=T(x+w-5,y+12.5,o.stack,{size:8.6,anchor:'end',fill:'#333'});
 this.s+=s;return {x:x,y:y,w:w,h:h}};
Panel.prototype.group=function(y,h,tag,o){o=o||{};var x=o.x==null?this.x-6:o.x,w=o.w==null?IW+12:o.w;this.s=R(x,y,w,h,{fill:o.cond?'#fafafa':'#ececec',stroke:o.cond?'#777':'#c4c4c4',sw:0.8,rx:4,dash:o.cond?'4 3':null})+T(x+6,y+11.5,tag,{size:8.3,fill:'#444',ls:0.25})+this.s;return {x:x,y:y,w:w,h:h}};
Panel.prototype.chip=function(x,y,w,h,label,o){o=o||{};var L=mwrap(label,w-6,o.size||8.2),s=R(x,y,w,h,{fill:o.fill||'#fff',sw:0.75,dash:o.cond?'3 2':null,stroke:o.stroke});var yy=y+(h-L.length*9.2)/2+7.4;L.forEach(function(l){s+=T(x+w/2,yy,l,{mono:true,size:o.size||8.2,anchor:'middle'});yy+=9.2});this.s+=s};
Panel.prototype.edge=function(A,B,o){o=o||{};var ax=o.ax==null?A.x+A.w/2:o.ax,ay=A.y+A.h,bx=o.bx==null?B.x+B.w/2:o.bx,by=B.y,d;
 if(Math.abs(ax-bx)<0.5)d='M'+r(ax)+' '+r(ay)+' V'+r(by-1.2);else{var my=o.my||(ay+by)/2;d='M'+r(ax)+' '+r(ay)+' V'+r(my)+' H'+r(bx)+' V'+r(by-1.2)}
 this.s+=P(d,{dash:o.dash?'4 3':null,arrow:this.AR});if(o.label)this.s+=lab(bx+5,(ay+by)/2+3,o.label,'start')};
Panel.prototype.loop=function(A,B,label,o){o=o||{};var ax=A.x+A.w,ay=A.y+A.h/2,bx=B.x+B.w,by=B.y+(o.toTop?8:B.h/2),ox=this.x0+PW-PAD-14;
 this.s+=P('M'+r(ax)+' '+r(ay)+' H'+r(ox)+' V'+r(by)+' H'+r(bx+1.2),{dash:'4 3',arrow:this.AR});
 this.s+=T(ox+11,(ay+by)/2,label,{size:8.6,italic:true,fill:'#333',anchor:'middle',rot:-90})};
Panel.prototype.head=function(F){this.s+=T(this.x,16,F.panel,{size:12.5,bold:true})+T(this.x+22,16,F.title,{size:12.5,bold:true});
 this.s+=T(this.x+22,30,F.task,{mono:true,size:9,fill:'#444'})+T(this.x0+PW-PAD,30,F.domain,{size:9.4,italic:true,fill:'#555',anchor:'end'});
 var sy=40,L=wrap(F.script,IW-12,8.8,3),h=19+L.length*10+5,x=this.x,w=IW,f=7,s='';
 s+='<path d="M'+r(x)+' '+r(sy)+' H'+r(x+w-f)+' L'+r(x+w)+' '+r(sy+f)+' V'+r(sy+h)+' H'+r(x)+' Z" fill="#fff" stroke="#111" stroke-width="0.9"/>';
 s+='<path d="M'+r(x+w-f)+' '+r(sy)+' V'+r(sy+f)+' H'+r(x+w)+'" fill="none" stroke="#111" stroke-width="0.9"/>';
 s+=T(x+6,sy+12.5,'submitted script',{size:9.2,bold:true})+T(x+6+tw('submitted script',9.2)*1.1+4,sy+12.5,F.lines,{size:9,italic:true,fill:'#444'});
 L.forEach(function(l,i){s+=T(x+6,sy+24+i*10,l,{size:8.8,fill:'#222'})});this.s+=s;return {x:x,y:sy,w:w,h:h}};
Panel.prototype.foot=function(y,F){var gx=this.x,s='';F.glyph.forEach(function(g){var n=typeof g==='number'?g:g[0];for(var i=0;i<n;i++){if(gx>this.x+IW+LOOP-14){gx=this.x;y+=7.6}s+='<rect x="'+r(gx)+'" y="'+r(y)+'" width="5.6" height="5.6" fill="'+(typeof g==='number'?'#222':'#fff')+'" stroke="#222" stroke-width="0.7"/>';gx+=7.2}gx+=5}.bind(this));
 y+=16;F.stats.forEach(function(l,i){s+=T(this.x,y+i*12.5,l,{size:i?9.2:10,fill:i?'#333':'#111',italic:i>1})}.bind(this));this.s+=s;return y+F.stats.length*12.5};

/* ------------------------------------------------------------------ the five workflows */
var W5=[
{id:'maud',panel:'(a)',title:'matrix fan-out',task:'cs-maud-12 · maud-deal-points',domain:'law',lines:'139 lines',
 script:'embeds 4 deal-point groups (30 questions), option lists via args, and the 17 survey computations as code',

 draw:function(p,y){var top=p.head(this),G=['mae','cond','dp','oc'],N=[13,6,7,4],AG=['A01','A02','A03','A04','A05','A06','A07','A08','A09','A10'];
  y=top.y+top.h+GAPY;var gy=y,cw=(IW-34)/4,ch=12.4,hy=gy+22,gh=20+14+AG.length*(ch+2.2)+6,g=p.group(gy,gh,'parallel · 40 agents · label <agreement>-<group>');
  G.forEach(function(k,i){p.s+=T(p.x+30+i*cw+cw/2,hy+3,k+' ('+N[i]+' q)',{mono:true,size:8.2,anchor:'middle',fill:'#333'})});
  AG.forEach(function(a,j){var yy=hy+9+j*(ch+2.2);p.s+=T(p.x+2,yy+ch-3,a,{mono:true,size:8.2,fill:'#333'});G.forEach(function(k,i){p.chip(p.x+30+i*cw+2,yy,cw-4,ch,a+'-'+k,{size:7.4})})});
  var g2={x:g.x,y:g.y,w:g.w,h:g.h};y=gy+gh+GAPY;
  var red=p.node(y,'<agreement>-<group>-redo','only cells whose answer is not an exact standard option',{cond:true,stack:'≤ 40'});p.edge(g2,red,{dash:true,label:'invalid answers'});
  y=red.y+red.h+GAPY;var mg=p.node(y,'merge in script code (no agent)','300-cell table; survey answers M01–M17 computed deterministically',{code:true});p.edge(red,mg);
  p.s+=P('M'+r(g2.x)+' '+r(g2.y+g2.h-8)+' H'+r(g2.x-7)+' V'+r(mg.y+mg.h/2)+' H'+r(mg.x-1.2),{arrow:p.AR,stroke:'#333'});
  y=mg.y+mg.h+GAPY;var wr=p.node(y,'write-files','deal_points.csv + answers.json; round-trip check',{check:false});p.edge(mg,wr);return wr.y+wr.h+22}},
{id:'biomass',panel:'(b)',title:'dependency DAG, eager start',task:'repro-biomass-census · biomass-census',domain:'science',lines:'116 lines',

  y=ch.y+ch.h+GAPY;var A=['bacteria_archaea','plants','chordates','invertebrates_non_arthropod','terrestrial_arthropods'],B={bacteria_archaea:['fungi','protists','viruses'],invertebrates_non_arthropod:['marine_arthropods']};

  rowsY.forEach(function(rw0){var a=rw0[0],yy=rw0[1],H=rw0[2],ay=yy+(H-hh)/2;p.chip(p.x,ay,lw,hh,a,{size:8});
   (B[a]||[]).forEach(function(b,i){var by=yy+i*(bh+4);p.chip(rx,by,rw,bh,b,{size:8});p.s+=P('M'+r(p.x+lw)+' '+r(ay+hh/2)+' C'+r(p.x+lw+14)+' '+r(ay+hh/2)+' '+r(rx-14)+' '+r(by+bh/2)+' '+r(rx-1.2)+' '+r(by+bh/2),{arrow:p.AR,sw:0.8})})});
  p.edge(ch,g);y=y+gh+GAPY;var ag=p.node(y,'aggregate','7 CSV tables, NOTES.md');p.edge(g,ag);
  y=ag.y+ag.h+GAPY;var rh=58,rg=p.group(y,rh,'parallel · 3 reviewers · review-<round>-<area>'),cw=(IW-12)/3;
  ['prokaryotes, viruses, fungi, protists','plants, animals','aggregation and CSV format'].forEach(function(t,i){var x=p.x+i*(cw+6),s=R(x,y+18,cw,32,{fill:'#f4f4f4',sw:0.75});s+=T(x+4,y+29,'review-<r>-'+i,{mono:true,size:8});wrap(t,cw-8,7.8,2).forEach(function(l,k){s+=T(x+4,y+39+k*8.8,l,{size:7.8,italic:true,fill:'#444'})});p.s+=s});
  p.edge(ag,rg);p.loop(rg,rg,'≤ 2 rounds',{toTop:true});
  y=rg.y+rg.h+GAPY;var fc=p.node(y,'final-check','rerun run_all.py; headers, keys, NOTES.md',{check:true});p.edge(rg,fc);return fc.y+fc.h+22}},
{id:'pyscf',panel:'(c)',title:'concurrent promises, one dependent stage',task:'pr-pyscf-3049 · pyscf-ccsdt',domain:'software',lines:'77 lines',

 draw:function(p,y){var top=p.head(this);y=top.y+top.h+GAPY;var cw=(IW-12)/3,ch=46,gh=18+ch+GAPY+40+8,g=p.group(y,gh,'launched together (promises, no barrier)'),bx=[];
  [['reference','independent CCSDT/CCSDTQ solver, no repo edits'],['rccsdt','RCCSDT, C extension, factories'],['uccsdt','UCCSDT, RHF↔UHF conversion']].forEach(function(n,i){var x=p.x+i*(cw+6),b=p.node(y+18,n[0],n[1],{w:cw,x:x,size:9.2});bx.push(b)});
  var tq=p.node(y+18+bx[1].h+GAPY,'rccsdtq','RCCSDTQ; reads the finished rccsdt',{w:cw,x:bx[1].x,size:9.2});p.edge(bx[1],tq,{label:'await'});
  var gb={x:g.x,y:g.y,w:g.w,h:Math.max(g.h,tq.y+tq.h+8-g.y)};p.edge(top,gb);

 draw:function(p,y){var top=p.head(this);y=top.y+top.h+GAPY;var ar=p.node(y,'architect','lake build; write 10–25 compiling skeleton files with sorry\'d lemmas');p.edge(top,ar);

function buildRow(list,id){var AR='a5-'+id,s='',maxY=0,panels=[];
 list.forEach(function(F,i){var p=new Panel(i*PW,AR);var end=F.draw(p,0);end=p.foot(end,F);panels.push(p);maxY=Math.max(maxY,end)});
 var W=list.length*PW,H=maxY+74;
 panels.forEach(function(p,i){if(i)s+=P('M'+r(p.x0)+' 6 V'+r(H-40),{stroke:'#d0d0d0',sw:0.6});s+=p.s});
 var ly=H-42,lx=PAD;s+=P('M'+PAD+' '+r(ly-13)+' H'+r(W-PAD),{stroke:'#bbb',sw:0.6});
 function item(d,t){var width=28+tw(t,9)+20;if(lx+width>W-PAD&&lx>PAD){lx=PAD;ly+=22}s+=d(lx,ly-7);s+=T(lx+28,ly+2,t,{size:9,fill:'#333'});lx+=width}
 item(function(x,yy){return R(x,yy,20,11)},'agent call');
 item(function(x,yy){return R(x,yy,20,11,{dash:'4 3'})},'runs only if a check fails');
 item(function(x,yy){return R(x,yy,20,11,{fill:'#ececec',stroke:'#c4c4c4',rx:3})},'concurrent block');
 item(function(x,yy){return R(x,yy,20,11,{fill:'#f4f4f4'})},'check');
 item(function(x,yy){return R(x,yy,20,11,{dash:'1.2 2.2',stroke:'#555',rx:5,fill:'#fbfbfb'})},'script code, no agent');
 item(function(x,yy){return P('M'+x+' '+(yy+10)+' C'+x+' '+(yy-2)+' '+(x+20)+' '+(yy-2)+' '+(x+20)+' '+(yy+9),{dash:'4 3',arrow:AR})},'bounded loop');
