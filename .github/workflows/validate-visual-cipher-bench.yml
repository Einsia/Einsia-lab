name: Validate Visual Cipher Bench

on:
  pull_request:
    paths:
      - '**/visual-cipher-bench/**'
      - '**/visual-cipher-bench*'
      - 'scripts/validate-site-output.mjs'
      - '.github/workflows/validate-visual-cipher-bench.yml'
      - 'package.json'
  push:
    branches: [site/visual-cipher-bench]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:phys-last-exam
      - run: npm run validate:embodiedevo
      - run: npm run build
      - run: npm run validate:phys-last-exam -- --root dist
